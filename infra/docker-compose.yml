services:
  postgres:
    image: postgres:17.4-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      # LOCAL DEV DEFAULT — NOT A SECRET
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local_dev}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d hotel_core && pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d hotel_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: hotel-minio
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # LOCAL DEV DEFAULT — NOT A SECRET
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    container_name: hotel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # LOCAL DEV DEFAULT — NOT A SECRET
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-hotel-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET_MEDIA}\"
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: hotel-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
