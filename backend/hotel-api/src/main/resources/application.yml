server:
  port: ${HOTEL_API_PORT:8081}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: hotel-api
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
  datasource:
    url: ${HOTEL_CORE_DB_URL:jdbc:postgresql://localhost:5432/hotel_core}
    username: ${HOTEL_CORE_DB_USER:app}
    # LOCAL DEV DEFAULT — NOT A SECRET
    password: ${HOTEL_CORE_DB_PASSWORD:app_local_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

hotel:
  cors:
    allowed-origins: ${HOTEL_API_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  media:
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MEDIA_S3_PUBLIC_ENDPOINT:http://localhost:9000}
      bucket: ${MEDIA_S3_BUCKET:hotel-media}
      access-key: ${MEDIA_S3_ACCESS_KEY:minioadmin}
      secret-key: ${MEDIA_S3_SECRET_KEY:minioadmin_local_dev}
      region: ${MEDIA_S3_REGION:us-east-1}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/hotel-media/public}
    upload:
      presign-ttl: ${MEDIA_PRESIGN_TTL:10m}
    processing:
      max-attempts: ${MEDIA_PROCESSING_MAX_ATTEMPTS:3}
      stale-threshold: ${MEDIA_PROCESSING_STALE_THRESHOLD:10m}
      recovery-initial-delay: ${MEDIA_PROCESSING_RECOVERY_INITIAL_DELAY:30s}
      recovery-interval: ${MEDIA_PROCESSING_RECOVERY_INTERVAL:60s}
    cleanup:
      initial-delay: ${MEDIA_CLEANUP_INITIAL_DELAY:30s}
      interval: ${MEDIA_CLEANUP_INTERVAL:60s}
      grace: ${MEDIA_CLEANUP_GRACE:5m}
      max-attempts: ${MEDIA_CLEANUP_MAX_ATTEMPTS:10}
  pricing:
    quote-ttl: ${HOTEL_PRICING_QUOTE_TTL:15m}
    max-stay-nights: ${HOTEL_PRICING_MAX_STAY_NIGHTS:30}
    defaults:
      buffer-percent: ${HOTEL_PRICING_DEFAULT_BUFFER_PERCENT:2.00}
      rounding-step: ${HOTEL_PRICING_DEFAULT_ROUNDING_STEP:5.00}
    tcmb:
      enabled: ${HOTEL_PRICING_TCMB_ENABLED:true}
      url: ${HOTEL_PRICING_TCMB_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
      cron: ${HOTEL_PRICING_TCMB_CRON:0 30 15 * * MON-FRI}
      zone: ${HOTEL_PRICING_TCMB_ZONE:Europe/Istanbul}
      connect-timeout: ${HOTEL_PRICING_TCMB_CONNECT_TIMEOUT:3s}
      read-timeout: ${HOTEL_PRICING_TCMB_READ_TIMEOUT:10s}
  admin:
    jwks-uri: ${HOTEL_ADMIN_JWKS_URI:http://localhost:8082/admin-api/.well-known/jwks.json}
    issuer: ${HOTEL_ADMIN_JWT_ISSUER:admin-api}
    audience: ${HOTEL_ADMIN_JWT_AUDIENCE:hotel-admin-api}
    # Remote JWKS is cached for 5 minutes; an unknown kid refreshes at most once per 60 seconds.
    jwks-cache-ttl: ${HOTEL_ADMIN_JWKS_CACHE_TTL:5m}
    jwks-cache-refresh: ${HOTEL_ADMIN_JWKS_CACHE_REFRESH:15s}
    jwks-cooldown: ${HOTEL_ADMIN_JWKS_COOLDOWN:60s}
    jwks-connect-timeout: ${HOTEL_ADMIN_JWKS_CONNECT_TIMEOUT:2s}
    jwks-read-timeout: ${HOTEL_ADMIN_JWKS_READ_TIMEOUT:2s}

management:
  prometheus:
    allowed-cidr: ${MANAGEMENT_PROMETHEUS_ALLOWED_CIDR:127.0.0.1/32,::1/128}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read_only
      show-details: never
    prometheus:
      access: read_only

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
