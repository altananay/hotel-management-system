server:
  port: ${ADMIN_API_PORT:8082}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: admin-api
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
  datasource:
    url: ${HOTEL_ADMIN_DB_URL:jdbc:postgresql://localhost:5432/hotel_admin}
    username: ${HOTEL_ADMIN_DB_USER:app}
    # LOCAL DEV DEFAULT — NOT A SECRET
    password: ${HOTEL_ADMIN_DB_PASSWORD:app_local_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

admin:
  gateway:
    upstream-hotel-api-url: ${ADMIN_API_UPSTREAM_HOTEL_API_URL:http://localhost:8081}
    timeout: ${ADMIN_GATEWAY_TIMEOUT_MS:3000}ms
  jwt:
    issuer: ${ADMIN_JWT_ISSUER:admin-api}
    audience: ${ADMIN_JWT_AUDIENCE:hotel-admin-api}
    ttl: ${ADMIN_JWT_TTL_SECONDS:300}s
    active-key-path: ${ADMIN_JWT_ACTIVE_KEY_PATH:.local/admin-jwt-active.pem}
    previous-public-key-path: ${ADMIN_JWT_PREVIOUS_PUBLIC_KEY_PATH:}
    allow-generated-dev-key: ${ADMIN_JWT_ALLOW_GENERATED_DEV_KEY:false}
  session:
    idle-timeout: ${ADMIN_SESSION_IDLE_MINUTES:30}m
    absolute-timeout: ${ADMIN_SESSION_ABSOLUTE_HOURS:8}h
  cookie:
    secure: ${ADMIN_COOKIE_SECURE:false}
  csrf:
    secret: ${ADMIN_CSRF_SECRET:local-admin-csrf-secret-32-bytes-min!!}
    pre-auth-ttl: 15m
  allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:3001}
  trusted-proxy-cidrs: ${ADMIN_TRUSTED_PROXY_CIDRS:}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      show-details: never

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
